# Builds the API reference with Sphinx and publishes it beside the project page.
# The published site is docs/site at the root and the reference under api/.
# Requires the repository's Pages source to be set to "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package with the docs extra
        run: python -m pip install -e ".[docs]"
      - name: Check project page matches its sources
        run: python docs/site/build_page.py --check
      - name: Assemble the site
        env:
          # the reference's logo links back to the project page at the site's root
          HYBRID_AIF_SITE_URL: /${{ github.event.repository.name }}/
        run: |
          mkdir -p _site
          rsync -a docs/site/ _site/ \
            --exclude page-prose.md --exclude page-blocks.html --exclude build_page.py \
            --exclude README.md
          python -m sphinx -b html docs/api _site/api
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
