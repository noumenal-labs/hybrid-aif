G_scales: {crspp: 1.0, ig: 1.0, rew: 1.0}
actent: 0.0003
actor:
  act: silu
  fan: avg
  inputs: [deter, stoch]
  layers: 3
  maxstd: 1.0
  minstd: 0.1
  norm: layer
  outnorm: false
  outscale: 1.0
  symlog_inputs: false
  unimix: 0.01
  units: 256
  winit: normal
actor_dist_cont: normal
actor_dist_disc: onehot
actor_grad_cont: backprop
actor_grad_disc: reinforce
actor_opt: {clip: 100.0, eps: 1e-05, lateclip: 0.0, lr: 3e-05, opt: adam, warmup: 0,
  wd: 0.0}
batch_length: 64
batch_size: 16
cont_head:
  act: silu
  dist: binary
  fan: avg
  inputs: [deter, stoch]
  layers: 2
  norm: layer
  outnorm: false
  outscale: 1.0
  units: 32
  winit: normal
critic:
  act: silu
  bins: 255
  dist: symlog_disc
  fan: avg
  inputs: [deter, stoch]
  layers: 2
  norm: layer
  outnorm: false
  outscale: 0.0
  symlog_inputs: false
  units: 32
  winit: normal
critic_opt: {clip: 100.0, eps: 1e-05, lateclip: 0.0, lr: 3e-05, opt: adam, warmup: 0,
  wd: 0.0}
critic_slowreg: logprob
data_loaders: 8
decoder:
  act: silu
  cnn: resnet
  cnn_blocks: 0
  cnn_depth: 16
  cnn_keys: ^$
  cnn_sigmoid: false
  fan: avg
  image_dist: mse
  inputs: [deter, stoch]
  minres: 4
  mlp_keys: state
  mlp_layers: 2
  mlp_units: 64
  norm: layer
  outscale: 1.0
  resize: stride
  vector_dist: symlog_mse
  winit: normal
dyn_loss: {free: 1.0, impl: kl}
encoder: {act: silu, cnn: resnet, cnn_blocks: 0, cnn_depth: 16, cnn_keys: ^$, fan: avg,
  minres: 4, mlp_keys: state, mlp_layers: 2, mlp_units: 64, norm: layer, resize: stride,
  symlog_inputs: true, winit: normal}
env:
  atari:
    actions: all
    gray: false
    lives: unused
    noops: 0
    repeat: 4
    resize: opencv
    size: [64, 64]
    sticky: true
  dm:
    camera: -1
    size: [64, 64]
  dmlab:
    episodic: true
    repeat: 4
    size: [64, 64]
  gymrobotics:
    image_size: [64, 64]
  loconav:
    camera: -1
    repeat: 2
    size: [64, 64]
  metaworld:
    image_size: [64, 64]
    reward_shaping: false
  minecraft:
    break_speed: 100.0
    size: [64, 64]
  robosuite:
    generate_images: true
    image_size: [64, 64]
    reward_shaping: false
envs: {amount: 4, checks: false, discretize: 0, parallel: process, reset: true, restart: true}
eval_dir: ''
expname: oracle_state_mc_seed0
filter: .*
grad_heads: [decoder, reward, cont]
horizon: 333
ig_head:
  act: silu
  dist: normal
  fan: avg
  inputs: [deter, stoch, action]
  layers: 2
  norm: layer
  outscale: 1.0
  units: 32
  winit: normal
ig_head_random_no_learning: 0.0
ig_models: 4
ig_opt: {clip: 100.0, eps: 1e-05, lr: 0.0001, opt: adam, warmup: 0, wd: 0.0}
ig_target: [stoch]
imag_horizon: 8
imag_unroll: false
jax:
  debug: false
  debug_nans: false
  jit: true
  logical_cpus: 0
  metrics_every: 10
  platform: cpu
  policy_devices: [0]
  prealloc: false
  precision: float16
  train_devices: [0]
logdir: logs/oracle_state_mc_seed0
logroot: logs
loss_scales: {actor: 1.0, actor_refresh: 0.5, cont: 1.0, contrast: 1.0, critic: 1.0,
  dyn: 0.5, image: 1.0, rep: 0.1, reward: 1.0, slowreg: 1.0, vector: 1.0}
model_opt: {clip: 1000.0, eps: 1e-08, lateclip: 0.0, lr: 0.0001, opt: adam, warmup: 0,
  wd: 0.0}
rc: false
rep_loss: {free: 1.0, impl: kl}
replay: uniform
replay_online: false
replay_size: 500000.0
retnorm: {decay: 0.99, impl: perc_ema, max: 1.0, perchi: 95.0, perclo: 5.0}
return_lambda: 0.95
reward_head:
  act: silu
  bins: 255
  dist: symlog_disc
  fan: avg
  inputs: [deter, stoch]
  layers: 2
  norm: layer
  outnorm: false
  outscale: 0.0
  units: 32
  winit: normal
rssm: {act: silu, action_clip: 1.0, classes: 32, deter: 128, fan: avg, initial: learned,
  norm: layer, stoch: 32, unimix: 0.01, units: 32, unroll: false, winit: normal}
run:
  actor_addr: tcp://127.0.0.1:5551
  actor_batch: 32
  eval_eps: 1
  eval_every: 1000000.0
  eval_fill: 0
  eval_initial: true
  eval_samples: 1
  from_checkpoint: ''
  log_every: 300
  log_keys_max: ^$
  log_keys_mean: (log_entropy)
  log_keys_sum: ^$
  log_keys_video: [image]
  log_zeros: false
  save_every: 900
  script: train
  steps: 2000000
  sync_every: 10
  train_fill: 0
  train_ratio: 64.0
seed: 0
self_imitation: {disc: 0.4, fail: 0.3, thr: 0.001}
slow_critic_fraction: 0.02
slow_critic_update: 1
task: gym_mtc
wment: 0.0003
wrapper: {checks: false, delta: ^$, discretize: 0, length: 100, r_reward_offset: 1.1,
  repeat: 2, reset: true, stateconcat: ^$, stateconcat_target: state}
